name: Contract foundation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: contract-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check synthetic fixture hygiene
        id: hygiene
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/check_fixture_secrets.py

      - name: Set up the repository SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore ScaleProof.sln --locked-mode

      - name: Build with warnings as errors
        id: build
        run: dotnet build ScaleProof.sln --configuration Release --no-restore -warnaserror

      - name: Run unit and architecture tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/ScaleProof.UnitTests/ScaleProof.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory "$PWD/artifacts/test-results/unit"

      - name: Run schema and serialization golden tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/ScaleProof.ContractTests/ScaleProof.ContractTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=contracts.trx"
          --results-directory "$PWD/artifacts/test-results/contracts"

      - name: Retain test results and snapshot diagnostics
        if: ${{ !cancelled() && steps.hygiene.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-foundation-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/test-results/**/*.trx
            tests/ScaleProof.ContractTests/bin/Release/net10.0/Snapshots/*.received.txt
            tests/ScaleProof.ContractTests/bin/Release/net10.0/Snapshots/*.verified.txt
